name: pr-greeter

# HARDENED (see docs/fixes.md). Fix 3c: plain pull_request, which does not give fork PRs secrets.
# This job only prints a message, so it never needed the privileged pull_request_target trigger.
on:
  pull_request:
    types: [opened, edited]

# Fix 2: the token gets no permissions. This job only prints a message.
permissions: {}

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      # Fix 3: the PR title is passed as an environment variable (data), never pasted into the
      # script text. The shell reads "$PR_TITLE" at run time and does not parse it as commands.
      # Fix 3b: this job does not need any secret, so none is passed to it.
      - name: Say thanks
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Thanks for the pull request: $PR_TITLE"
