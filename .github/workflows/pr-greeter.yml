name: pr-greeter

# PARTLY HARDENED (see docs/fixes.md). The trigger below is still risky by design.
# pull_request_target runs with repo secrets, even for pull requests from forks.
on:
  pull_request_target:
    types: [opened, edited]

# Fix 2: the token gets no permissions. This job only prints a message.
permissions: {}

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      # Fix 3: the PR title is passed as an environment variable (data), never pasted into the
      # script text. The shell reads "$PR_TITLE" at run time and does not parse it as commands.
      # DEMO_API_TOKEN is still mapped on purpose, to prove it no longer leaks (removed in Fix 3b).
      - name: Say thanks
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          echo "Thanks for the pull request: $PR_TITLE"
