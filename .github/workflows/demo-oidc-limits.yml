name: demo-oidc-limits

# DEMO (run by hand). Both jobs are EXPECTED TO FAIL. They show the limits of the OIDC trust:
#  1. wrong-subject: same repo, but no "production" environment, so Azure refuses the token.
#  2. read-only-role: right environment, so login works, but the role is Reader so writes are refused.
on: workflow_dispatch

permissions: {}

jobs:
  wrong-subject:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_OIDC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  read-only-role:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_OIDC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Try to write (should be refused)
        run: az group update --name rg-pipeline-lab --set tags.demo=blocked -o none
