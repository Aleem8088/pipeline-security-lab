name: demo-movable-tag

# DEMO workflow (deliberately uses a movable tag). Run it by hand from the Actions tab.
# It uses a throwaway, harmless action in my own repo: Aleem8088/demo-action.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
      - uses: Aleem8088/demo-action@0df90fa1f2bb56e8e194638329e9b05438270bd3 # the benign commit that v1 originally pointed to
