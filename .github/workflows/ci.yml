name: ci

on: [push, pull_request]

# BEFORE STATE: deliberately weak. Do not copy this file.
# Weakness (c): the token can do almost anything, in every job.
permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Fix 1: third-party actions are pinned to full commit SHAs (version in the comment).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          tags: pipeline-security-lab:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Weakness (d): a long-lived cloud credential stored as a repo secret.
      # The value here is a harmless dummy; nothing is deployed anywhere.
      - name: Pretend deploy with a static service-principal secret
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          echo "would run: az login --service-principal -u $AZURE_CLIENT_ID ..."
          echo "static secret present: $([ -n "$AZURE_CLIENT_SECRET" ] && echo yes || echo no)"
