name: ci

on: [push, pull_request]

# PARTLY HARDENED (see docs/fixes.md). Fix 4 replaced the static cloud secret with OIDC.
# Fix 2: no permissions by default; each job asks for only what it needs.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block   # only the endpoints seen in audit mode are allowed
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to GHCR (main branch only)
      id-token: write   # keyless image signing with Sigstore (main branch only)
    env:
      IMAGE: ghcr.io/aleem8088/pipeline-security-lab
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block   # only the endpoints seen in audit mode are allowed
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            grype.anchore.io:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Fix 1: third-party actions are pinned to full commit SHAs (version in the comment).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true      # keep the image local until it has been scanned
          push: false
          tags: ghcr.io/aleem8088/pipeline-security-lab:${{ github.sha }}
      # Fix 6a: SBOM (a list of everything inside the image), kept as a build artifact.
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ghcr.io/aleem8088/pipeline-security-lab:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      # Fix 6b: scan the image for known vulnerabilities. Reports only for now; see docs/fixes.md.
      - uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: ghcr.io/aleem8088/pipeline-security-lab:${{ github.sha }}
          fail-build: false
          severity-cutoff: high
          output-format: table
      - name: Smoke test the image (does the pruned image still start?)
        run: |
          docker run -d --name app -p 3000:3000 "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 1; done
          docker logs app; exit 1
      # Fix 6c: on main only, push and sign the image (keyless, using the job's OIDC identity).
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        if: github.ref == 'refs/heads/main'
      - name: Push, sign, attest and verify
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "signing $REF"
          cosign sign --yes "$REF"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$REF"
          cosign verify "$REF"             --certificate-identity-regexp '^https://github.com/Aleem8088/pipeline-security-lab/'             --certificate-oidc-issuer https://token.actions.githubusercontent.com

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # lets this job ask GitHub for a short-lived identity token; it grants no repo access
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block   # allowlist taken from an audit-mode deploy run (Azure login + read)
          allowed-endpoints: >
            github.com:443
            login.microsoftonline.com:443
            management.azure.com:443
            azcliprod.blob.core.windows.net:443
      # Fix 4: no stored password. The job proves who it is with a short-lived OIDC token, and
      # Azure only accepts it for this repo's "production" environment (see infra/setup-azure-oidc.sh).
      # The three values below are identifiers, not credentials.
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_OIDC }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_OIDC }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prove the login worked (read-only)
        run: |
          az account show --query "{signedInAs:user.type}" -o json
          az group show --name rg-pipeline-lab --query "{resourceGroup:name, location:location}" -o json
