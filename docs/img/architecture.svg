<text x='175.0' y='176.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>PR</text>
<line x1='331' y1='185.0' x2='382' y2='185.0' stroke='#475569' stroke-width='2.5'/><polygon points='391,185.0 381,179.0 381,191.0' fill='#475569'/>
<text x='361.0' y='163.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>checks</text>
<text x='361.0' y='176.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>pass</text>
<line x1='517' y1='185.0' x2='568' y2='185.0' stroke='#475569' stroke-width='2.5'/><polygon points='577,185.0 567,179.0 567,191.0' fill='#475569'/>
<text x='547.0' y='163.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>squash</text>
<text x='547.0' y='176.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>merge</text>
<line x1='703' y1='185.0' x2='754' y2='185.0' stroke='#475569' stroke-width='2.5'/><polygon points='763,185.0 753,179.0 753,191.0' fill='#475569'/>
<text x='733.0' y='163.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>push +</text>
<text x='733.0' y='176.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>sign</text>
<line x1='889' y1='185.0' x2='940' y2='185.0' stroke='#475569' stroke-width='2.5'/><polygon points='949,185.0 939,179.0 939,191.0' fill='#475569'/>
<text x='919.0' y='163.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>pull by</text>
<text x='919.0' y='176.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>digest</text>
<line x1='1075' y1='185.0' x2='1126' y2='185.0' stroke='#475569' stroke-width='2.5'/><polygon points='1135,185.0 1125,179.0 1125,191.0' fill='#475569'/>
<text x='1105.0' y='163.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>approve</text>
<text x='1105.0' y='176.0' font-size='11' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>+ OIDC</text>
<rect x='12' y='116' width='140' height='204' rx='10' fill='none' stroke='#f87171' stroke-width='1.5' stroke-dasharray='5 4'/>
<text x='82.0' y='134' font-size='12' fill='#f87171' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>untrusted</text>
<rect x='1128' y='116' width='140' height='204' rx='10' fill='none' stroke='#4ade80' stroke-width='1.5' stroke-dasharray='5 4'/>
<text x='1198.0' y='134' font-size='12' fill='#4ade80' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>cloud</text>
<text x='24' y='410' font-size='15' fill='#e2e8f0' text-anchor='start' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>What each job is allowed to hold (this is the part that stops one weak step becoming a full compromise)</text>
<rect x='24' y='420' width='1232' height='28' rx='6' fill='#1e293b'/>
<text x='40' y='438' font-size='13' fill='#60a5fa' text-anchor='start' font-weight='bold' font-family='Consolas, Menlo, monospace'>test</text>
<text x='120' y='438' font-size='13' fill='#e2e8f0' text-anchor='start' font-weight='normal' font-family='Consolas, Menlo, monospace'>contents: read</text>
<text x='620' y='438' font-size='13' fill='#94a3b8' text-anchor='start' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>no secrets, no cloud</text>
<rect x='24' y='454' width='1232' height='28' rx='6' fill='#1e293b'/>
<text x='40' y='472' font-size='13' fill='#60a5fa' text-anchor='start' font-weight='bold' font-family='Consolas, Menlo, monospace'>build</text>
<text x='120' y='472' font-size='13' fill='#e2e8f0' text-anchor='start' font-weight='normal' font-family='Consolas, Menlo, monospace'>contents: read, packages: write, id-token: write</text>
<text x='620' y='472' font-size='13' fill='#94a3b8' text-anchor='start' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>signs with a one-time identity; no stored key</text>
<rect x='24' y='488' width='1232' height='28' rx='6' fill='#1e293b'/>
<text x='40' y='506' font-size='13' fill='#60a5fa' text-anchor='start' font-weight='bold' font-family='Consolas, Menlo, monospace'>deploy</text>
<text x='120' y='506' font-size='13' fill='#e2e8f0' text-anchor='start' font-weight='normal' font-family='Consolas, Menlo, monospace'>id-token: write only</text>
<text x='620' y='506' font-size='13' fill='#94a3b8' text-anchor='start' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>needs a human approval; Azure accepts only the production environment</text>
<rect x='24' y='550' width='1232' height='62' rx='8' fill='none' stroke='#fbbf24' stroke-width='1.5'/>
<text x='40' y='574' font-size='13' fill='#fbbf24' text-anchor='start' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Not stopped by any of this:</text>
<text x='40' y='596' font-size='13' fill='#e2e8f0' text-anchor='start' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>a third-party action that was already malicious when pinned  ·  exfiltration to a host on the allowlist  ·  one maintainer who can change the rules (0 required approvals)</text></svg>