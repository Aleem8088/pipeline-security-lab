<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='640' viewBox='0 0 1280 640' role='img' aria-label='Architecture: a pull request passes required checks, merges to main, is built, signed and pushed, then deployed to Azure through OIDC after a human approval'><rect width='1280' height='640' fill='#0f172a'/><text x='24' y='38' font-size='20' fill='#e2e8f0' text-anchor='start' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>How a change reaches production in this repo, and what guards each hop</text>
<text x='24' y='62' font-size='13' fill='#94a3b8' text-anchor='start' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Controls listed under each step are the ones that exist in the repo today. Arrows are labelled with what crosses them.</text>
<rect x='22' y='150' width='120' height='70' rx='8' fill='#1e293b' stroke='#f87171' stroke-width='2'/>
<text x='82.0' y='174' font-size='14' fill='#f87171' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Pull request</text>
<text x='82.0' y='246' font-size='12' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>title, body =</text>
<text x='82.0' y='265' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>untrusted text</text>
<text x='82.0' y='284' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>greeter: no secrets</text>
<text x='82.0' y='303' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>permissions: {}</text>
<rect x='208' y='150' width='120' height='70' rx='8' fill='#1e293b' stroke='#fbbf24' stroke-width='2'/>
<text x='268.0' y='174' font-size='14' fill='#fbbf24' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Required checks</text>
<text x='268.0' y='246' font-size='12' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>test + build + zizmor</text>
<text x='268.0' y='265' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>PR required</text>
<text x='268.0' y='284' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>admin enforced</text>
<rect x='394' y='150' width='120' height='70' rx='8' fill='#1e293b' stroke='#60a5fa' stroke-width='2'/>
<text x='454.0' y='174' font-size='14' fill='#60a5fa' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>main</text>
<text x='454.0' y='246' font-size='12' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>actions pinned to SHA</text>
<text x='454.0' y='265' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Dependabot, 7-day</text>
<text x='454.0' y='284' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>cooldown</text>
<rect x='580' y='150' width='120' height='70' rx='8' fill='#1e293b' stroke='#60a5fa' stroke-width='2'/>
<text x='640.0' y='174' font-size='14' fill='#60a5fa' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Build job</text>
<text x='640.0' y='246' font-size='12' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>harden-runner: block</text>
<text x='640.0' y='265' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>scoped token</text>
<text x='640.0' y='284' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>SBOM + vuln scan</text>
<rect x='766' y='150' width='120' height='70' rx='8' fill='#1e293b' stroke='#60a5fa' stroke-width='2'/>
<text x='826.0' y='174' font-size='14' fill='#60a5fa' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>GHCR image</text>
<text x='826.0' y='246' font-size='12' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>digest-pinned base</text>
<text x='826.0' y='265' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Cosign signature</text>
<text x='826.0' y='284' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>verified in CI</text>
<rect x='952' y='150' width='120' height='70' rx='8' fill='#1e293b' stroke='#fbbf24' stroke-width='2'/>
<text x='1012.0' y='174' font-size='14' fill='#fbbf24' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Deploy job</text>
<text x='1012.0' y='246' font-size='12' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>env approval (human)</text>
<text x='1012.0' y='265' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>main branch only</text>
<text x='1012.0' y='284' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>egress allowlist</text>
<rect x='1138' y='150' width='120' height='70' rx='8' fill='#1e293b' stroke='#4ade80' stroke-width='2'/>
<text x='1198.0' y='174' font-size='14' fill='#4ade80' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Azure</text>
<text x='1198.0' y='246' font-size='12' fill='#94a3b8' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>OIDC, no stored key</text>
<text x='1198.0' y='265' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Reader role only</text>
<text x='1198.0' y='284' font-size='12' fill='#e2e8f0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Helvetica, Arial, sans-serif'>subject = production</text>
<line x1='145' y1='185.0' x2='196' y2='185.0' stroke='#475569' stroke-width='2.5'/><polygon points='205,185.0 195,179.0 195,191.0' fill='#475569'/>
